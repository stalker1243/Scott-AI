name: Проверки выпуска Qt

on:
  push:
    branches: [new-launcher]
    tags: ['v2.*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend на чистой Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Библиотеки для CPU
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu
          python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Изолированные тесты backend
        env:
          PYTHONIOENCODING: utf-8
        run: python backend/run_tests.py
      - name: Полная подготовка моделей в новом CPU-кеше
        env:
          PYTHONIOENCODING: utf-8
          SCOTT_TORCH_BACKEND: cpu
          WHISPER_MODEL: small
        shell: pwsh
        run: |
          $env:XDG_CACHE_HOME = Join-Path $env:RUNNER_TEMP 'scott-first-setup'
          $env:TORCH_HOME = Join-Path $env:XDG_CACHE_HOME 'torch'
          python -u backend/bootstrap.py --json
          if ($LASTEXITCODE) { throw 'Model preparation failed' }
          python -u backend/bootstrap.py --check --json
          if ($LASTEXITCODE) { throw 'Prepared models failed readiness check' }

  qt:
    name: Qt на чистой Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          arch: win64_mingw
          tools: 'tools_mingw1310'
          # Qt 6.11 separates SDK repositories by architecture; aqt 3.3 lacks this mapping.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          cache: true
      - name: Собрать и проверить Qt
        shell: pwsh
        run: |
          $compiler = Join-Path (Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent) 'Tools/mingw1310_64'
          $env:PATH = "$compiler/bin;$env:QT_ROOT_DIR/bin;" + $env:PATH
          cmake -S ScottAI_qt -B ScottAI_qt/build -G Ninja "-DCMAKE_CXX_COMPILER=$compiler/bin/g++.exe" "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build ScottAI_qt/build --parallel 4
          if ($LASTEXITCODE) { throw 'Build failed' }
          # Native desktop/compositor checks run locally on Windows 11.
          ctest --test-dir ScottAI_qt/build --output-on-failure -LE native_desktop
          if ($LASTEXITCODE) { throw 'Qt checks failed' }
