name: Проверки

# Гоняем на каждое изменение в main и на каждый запрос на слияние. До этого
# тесты запускались только вручную на машине разработчика: поломка, внесённая
# в одной сессии, могла дожить до выпуска и уехать к людям — так уже случалось
# с переименованием, после которого программа перестала запускаться.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, new-launcher]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/release-check.yml

  macos:
    name: Проверки на macOS
    runs-on: macos-latest

    # Единственное место, где macOS-ветки видит настоящая macOS. У нас её нет,
    # и ветки поиска приложений и системных действий локально проверены
    # подменой платформы. Здесь проверяем настоящий osascript и каталог приложений.
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Зависимости
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # torch для процессора: видеокарты NVIDIA на Mac не бывает, а Metal
          # приходит в обычной сборке с PyPI.
          pip install torch
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Тесты backend
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          WARMUP_MODELS: "0"
        run: python run_tests.py

      - name: Проверка веток macOS на живой системе
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
        # Здесь важен не результат, а то, что ветки вообще исполняются на
        # macOS: команды существуют, каталог приложений читается, Spotlight
        # отвечает. Перечисленные Scott умения печатаются в лог — по ним видно,
        # что именно система дала, а что нет.
        run: |
          python -c "
          import json, os_actions, app_resolver
          print('умения:', json.dumps(os_actions.describe_capabilities(), ensure_ascii=False))
          print('каталог приложений:', app_resolver.refresh_index())
          найдено = app_resolver.resolve_app('safari')
          print('safari:', найдено.target if найдено else 'НЕ НАЙДЕНА')
          assert найдено, 'Safari не нашлась — на Mac она есть всегда'
          "
