[pytest]
# Pytest конфигурация для Scott v3.3

# Директория с тестами
testpaths = tests

# Паттерны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Минимальная версия
minversion = 7.0

# Маркеры
markers =
    unit: Unit тесты для отдельных модулей
    integration: Integration тесты для API
    stability: Тесты на стабильность и нагрузку
    slow: Медленные тесты (>5 сек)
    smoke: Smoke тесты для быстрой проверки

# Опции
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Игнорируй эти директории
norecursedirs = .git .tox dist build *.egg __pycache__ .venv

# Timeout для тестов (в секундах)
timeout = 300

# Логирование
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Coverage
[coverage:run]
source = .
omit = 
    tests/*
    */__pycache__/*
    */.*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
